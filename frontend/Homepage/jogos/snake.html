<div style="text-align: center; color: white; font-family: sans-serif;">
    <h3>🐍 Jogo da Cobrinha</h3>
    <div id="status-jogo" style="font-size: 20px; font-weight: bold; margin-bottom: 5px;">Preparar...</div>
    <div style="font-size: 18px; margin-bottom: 10px;">Pontuação: <span id="score">0</span></div>
    <canvas id="snakeGame" width="400" height="400" style="border: 2px solid #fff; background: #000; display: block; margin: 0 auto;"></canvas>
    <p>Use as setas do teclado para jogar!</p>
</div>

<script>
    (function() {
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status-jogo");
        const scoreElement = document.getElementById("score");
        const box = 20;
        
        let snake = [{ x: 10 * box, y: 10 * box }];
        let direction = "RIGHT";
        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };
        let game;
        let contador = 3;
        let pontos = 0; 

        function iniciarContagem() {
            if (contador > 0) {
                status.innerText = "Começando em: " + contador;
                drawStatic();
                contador--;
                setTimeout(iniciarContagem, 1000);
            } else {
                status.innerText = "VALENDO! 🍎";
                document.addEventListener("keydown", changeDirection);
                game = setInterval(draw, 100);
            }
        }

        function changeDirection(event) {
            if (event.keyCode == 37 && direction != "RIGHT") direction = "LEFT";
            else if (event.keyCode == 38 && direction != "DOWN") direction = "UP";
            else if (event.keyCode == 39 && direction != "LEFT") direction = "RIGHT";
            else if (event.keyCode == 40 && direction != "UP") direction = "DOWN";
        }

        function drawStatic() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "green";
            ctx.fillRect(snake[0].x, snake[0].y, box, box);
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "green" : "lime";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (direction == "LEFT") snakeX -= box;
            if (direction == "UP") snakeY -= box;
            if (direction == "RIGHT") snakeX += box;
            if (direction == "DOWN") snakeY += box;

            
            if (snakeX == food.x && snakeY == food.y) {
                pontos++; 
                scoreElement.innerText = pontos; 
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                status.innerText = "GAME OVER! 💀";
                
                setTimeout(() => {
                    alert("Fim de jogo!\nSua pontuação final foi: " + pontos + " pontos.");
                }, 100);
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        iniciarContagem();
    })();
</script>
